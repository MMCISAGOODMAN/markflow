<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markflow — Markdown Editor</title>
    <link rel="stylesheet" href="/src/styles/themes.css" />
    <link rel="stylesheet" href="/src/styles/ribbon.css" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <header class="title-bar">
        <div class="title-bar__brand">
          <svg class="title-bar__logo" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M3 3h18v2H3V3zm0 4h12v2H3V7zm0 4h18v2H3v-2zm0 4h12v2H3v-2zm0 4h18v2H3v-2z"/>
          </svg>
          <span class="title-bar__name">Markflow</span>
        </div>
        <span class="title-bar__subtitle">Markdown Editor</span>
      </header>

      <nav id="ribbon" class="ribbon" aria-label="Formatting toolbar"></nav>

      <main id="workspace" class="workspace">
        <section class="pane pane--editor">
          <div class="pane__header">
            <span class="pane__header-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
            </span>
            Markdown 源码
          </div>
          <textarea
            id="editor"
            class="editor"
            spellcheck="false"
            placeholder="在此输入 Markdown 内容..."
          ></textarea>
        </section>
        <div
          id="pane-divider"
          class="pane-divider"
          role="separator"
          aria-orientation="vertical"
          aria-label="拖动调整面板大小，双击恢复默认"
          tabindex="0"
        >
          <div class="pane-divider__grip" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
        <section class="pane pane--preview">
          <div class="pane__header">
            <span class="pane__header-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
            预览
          </div>
          <div class="preview-wrapper">
            <div id="preview" class="preview"></div>
          </div>
        </section>
      </main>

      <footer class="status-bar">
        <div class="status-bar__left">
          <span id="stat-lines">行数: 1</span>
          <span class="status-bar__sep">|</span>
          <span id="stat-chars">字符: 0</span>
          <span class="status-bar__sep">|</span>
          <span id="stat-words">词数: 0</span>
        </div>
        <div class="status-bar__right">
          <span id="stat-theme">浅色主题</span>
        </div>
      </footer>

      <input
        id="file-import"
        type="file"
        accept=".md,.markdown,text/markdown,text/plain"
        hidden
      />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
